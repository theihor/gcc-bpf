name: Build latest GCC
on:
  schedule:
    - cron: '0 0 * * 2'
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      gcc-version:
        description: 'Major GCC version to build (e.g. 15, 16)'
        required: false
        default: '15'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:

      - uses: actions/checkout@v4

      - name: Setup build prerequisites
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential file flex texinfo wget xz-utils zstd

      - name: Build GCC
        uses: libbpf/ci/build-bpf-gcc@main
        with:
          install-dir: gcc-bpf
          # Empty on schedule/push events -> defaults to 15 in the action.
          gcc-version: ${{ inputs.gcc-version }}

      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: ./update-latest-release.sh gcc-bpf

